# Build + test only. Release assets are attached manually (gh release create), so CI never
# re-uploads or replaces them.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test plugin
      - uses: actions/upload-artifact@v4
        with:
          name: spmod
          path: build/libs/*.spmod
